<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability Table</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <!--Accessibility Table-->
    <table>
      <!--Days of the week-->
      <thead>
        <th class="empty" scope="col"></th>
        <th class="" scope="col">Monday</th>
        <th class="" scope="col">Tuesday</th>
        <th class="" scope="col">Wednesday</th>
        <th class="" scope="col">Thursday</th>
        <th class="" scope="col">Friday</th>
      </thead>
      
      <tbody>
        <!-- <tr class="sharp">
              <th class="time" scope="row">9:00 AM</th>
              <td class="available-0"></td>
              <td class="available-1"></td>
              <td class="available-2"></td>
              <td class="available-4"></td>
              <td class="available-5"></td>
              </tr>-->
        
        <tr class="half">
          <th class="time" scope="row">9:00 AM</th>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="sharp">
          <th class="time" scope="row">9:30 AM</th>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        <tr class="half">
          <th class="time" scope="row">10:00 AM</th>
          <td class="available-0"></td>
          <td class="available-2"></td>
          <td class="available-3"></td>
          <td class="available-3"></td>
          <td class="available-0"></td>
        </tr>
        
        <tr class="sharp">
          <th class="time" scope="row">10:30 AM</th>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-1"></td>
          <td class="available-3"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="half">
          <th class="time" scope="row">11:00 AM</th>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-3"></td>
          <td class="available-2"></td>
          <td class="available-0"></td>
        </tr>
        
        
        <tr class="sharp">
          <th class="time" scope="row">11:30 AM</th>
          <td class="available-3"></td>
          <td class="available-0"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="half">
          <th class="time" scope="row">12:00 PM</th>
          <td class="available-2"></td>
          <td class="available-3"></td>
          <td class="available-3"></td>
          <td class="available-2"></td>
          <td class="available-0"></td>
        </tr>
        
        
        <tr class="sharp">
          <th class="time" scope="row">12:30 PM</th>
          <td class="available-3"></td>
          <td class="available-0"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="half">
          <th class="time" scope="row">1:00 PM</th>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="sharp">
          <th class="time" scope="row">1:30 PM</th>
          <td class="available-0"></td>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
        </tr>
        
        
        <tr class="half">
          <th class="time" scope="row">2:00 PM</th>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="sharp">
          <th class="time" scope="row">2:30 PM</th>
          <td class="available-3"></td>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-4"></td>
        </tr>
        
        
        <tr class="half">
          <th class="time" scope="row">3:00 PM</th>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
        </tr>
        
        
        <tr class="sharp">
          <th class="time" scope="row">3:30 PM</th>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
        </tr>
        
        
        <tr class="half">
          <th class="time" scope="row">4:00 PM</th>
          <td class="available-3"></td>
          <td class="available-0"></td>
          <td class="available-4"></td>
          <td class="available-2"></td>
          <td class="available-5"></td>
        </tr>
        
        <tr class="sharp">
          <th class="time" scope="row">4:30 PM</th>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
        </tr>
      </tbody>
      
    </table>
    <div id="legend">
      <span id="availability">Availability</span>
      <div class="gradient-container">
        <div class="not-available">0</div>
        <div id="legend-gradient">
        </div>
        <div class="available">5+</div>
      </div>
    </div>
  </div>
</body>

</html>
